[project]
name = "leaflab"
version = "0.1.0"
description = "Big Leaf water sculpture — parametric leaf generation, fast water proxy, scoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "trimesh>=4.12.2",
    "typer>=0.25.1",
]

[project.scripts]
leaflab = "leaflab.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leaflab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"gh/scripts/**/*.py" = ["UP"]
"leaflab/cli/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["gh/scripts/", "tests/"]
